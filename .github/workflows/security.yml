name: Security scans

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "33 17 * * 5"

permissions:
  contents: read

jobs:
  bundler-audit:
    name: bundler-audit (gem advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: gem install bundler-audit --no-document
      - run: bundle-audit check --update

  gitleaks:
    name: gitleaks (secret scanning)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan commits in this change
        if: github.event_name != 'schedule'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="${BASE_SHA}..${HEAD_SHA}"
          else
            RANGE="${BEFORE_SHA}..${AFTER_SHA}"
          fi
          gitleaks git . -c .gitleaks.toml -v --redact --no-banner --exit-code 1 --log-opts="$RANGE"
      - name: Scan working tree
        run: gitleaks dir . -c .gitleaks.toml -v --redact --no-banner --exit-code 1

  zizmor:
    name: zizmor (GitHub Actions workflow audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install zizmor==1.32.0
      - run: zizmor --no-progress --min-severity high --config .github/zizmor.yml .github/workflows
